{{- $podAnnotations := .Values.podAnnotations | default dict }}
{{- $injectEnabled := get $podAnnotations "inject.xfsc.io/enabled" | default "" | toString }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "app.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

    spec:
      containers:
        - name: {{ include "app.name" . }}
          image: "{{ .Values.image.repository }}/{{ .Values.image.name }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}

          env:
{{- if eq $injectEnabled "false" }}
            - name: SIGNER_SIGN_URL
              value: {{ .Values.config.signUrl | quote }}
            - name: RESOLVER_URL
              value: {{ .Values.config.resolverUrl | quote }}
{{- end }}
            - name: PORT
              value: {{ .Values.service.port | toString | quote }}

          ports:
            - name: http
              containerPort: {{ .Values.service.port }}

          readinessProbe:
            httpGet:
              path: /isAlive
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 2
            failureThreshold: 2
            timeoutSeconds: 5